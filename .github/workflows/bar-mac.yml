# Builds the BAR launcher for macOS (see bar-mac/build.sh). Pushes and pull
# requests get an ad-hoc signed app; tags matching v* are signed and notarized
# when the Developer ID secrets are set and publish DMG, zip and latest-mac.yml
# as a GitHub release, from which the launcher updates itself.
#
# Secrets (set to CHANGE_ME or missing: ad-hoc signed):
#   MACOS_CERT_P12         base64 of the exported "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD    password of that .p12
#   APPLE_ID               Apple ID used for notarization
#   APPLE_TEAM_ID          team id of the Developer ID certificate
#   APPLE_APP_PASSWORD     app-specific password of that Apple ID

name: BAR macOS launcher
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - bar-mac
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_P12 != 'CHANGE_ME' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_APP_PASSWORD != 'CHANGE_ME' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: beyond-all-reason/BYAR-Chobby
          path: chobby-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import signing certificate
        if: env.IS_RELEASE == 'true' && env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application:[^"]*"' | head -n1 | tr -d '"')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
            # the launcher moved to BYAR-Chobby's macOS build, this release hands the update over
            export UPDATE_URL="https://github.com/leonseemann/BYAR-Chobby/releases/latest/download"
            if [ "$HAS_NOTARY" = true ] && [ -n "${SIGN_IDENTITY:-}" ]; then
              export NOTARIZE=1
            fi
          fi
          bar-mac/build.sh chobby-src dist

      - uses: actions/upload-artifact@v4
        with:
          name: BAR-macos-launcher
          path: dist/BAR-*.dmg

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the zip and latest-mac.yml are what the launcher's self-update downloads
          gh release create "$GITHUB_REF_NAME" dist/BAR-*.dmg dist/BAR-*.zip dist/latest-mac.yml \
            --title "BAR for macOS launcher ($GITHUB_REF_NAME)" \
            --notes "Beyond All Reason launcher for Apple Silicon Macs. Open the DMG, drag BAR into Applications and start it; the launcher downloads the macOS engine and the game, and updates itself from these releases."
